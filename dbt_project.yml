

name: 'bakehouse'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'bakehouse'

# These configurations specify where dbt should look for different types of files.
# For Databricks asset bundles, we put everything in src, as you may have
# non-dbt resources in your project.
model-paths: ["src/models"]
analysis-paths: ["src/analyses"]
test-paths: ["src/tests"]
seed-paths: ["src/seeds"]
macro-paths: ["src/macros"]
snapshot-paths: ["src/snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views by default. These settings can be overridden in the
# individual model files using the `{{ config(...) }}` macro.
models:
  bakehouse:
    # write model/column descriptions to Unity Catalog as table/column comments
    +persist_docs:
      relation: true
      columns: true
    +databricks_tags:
      managed_by: dbt

    01_bronze:
      +materialized: table
      +catalog: "bronze"
      +tags: ["bronze"]
      +databricks_tags:
        layer: bronze

    02_silver:
      +materialized: table
      +catalog: "silver"
      +tags: ["silver"]
      +contract:
        enforced: true
      +databricks_tags:
        layer: silver

    03_gold:
      +materialized: table
      +catalog: "gold"
      +tags: ["gold"]
      +contract:
        enforced: true
      +databricks_tags:
        layer: gold

seeds:
  bakehouse:
    +database: bronze
    +schema: seeds
    +tags: ["bronze", "seed"]
    +persist_docs:
      relation: true
      columns: true
    +databricks_tags:
      managed_by: dbt
      layer: bronze

  
