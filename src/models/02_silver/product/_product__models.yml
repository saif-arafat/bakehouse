version: 2

models:
  - name: product
    description: >
      One row per product. The ERP has no product master, so products are derived from the
      distinct product names seen in transactions.
    config:
      tags: ["product"]
      databricks_tags:
        domain: product
        source_system: erp
    columns:
      - name: product_sk
        data_type: string
        description: Surrogate key, hash of product_name.
        constraints:
          - type: not_null
          - type: primary_key
            name: pk_product
        data_tests: [unique]
      - name: product_name
        data_type: string
        description: Product name as it appears on transactions; the natural key.
        data_tests: [unique, not_null]
      - name: product_unit_price
        data_type: decimal(18,6)
        description: Highest unit price ever charged for the product.
      - name: product_release_date
        data_type: timestamp
        description: Timestamp of the product's first transaction (a first-sold date, not a launch date).
      - name: md_loaded_at_ts
        data_type: timestamp
        
